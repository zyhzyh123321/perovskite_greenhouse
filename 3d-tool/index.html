<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>半透明光伏温室 · 交互原型</title>
<style>
  :root{
    --bg:#0e1417; --panel:#151d22; --panel2:#1b262c; --line:#26343c;
    --ink:#e7eef1; --muted:#8ea2ac; --accent:#37b0c9; --warn:#d9a13b; --bad:#8c99a3;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;overflow:hidden}
  #app{display:grid;grid-template-columns:300px 1fr 360px;grid-template-rows:1fr 150px;
    gap:10px;padding:10px;height:100%}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;position:relative}
  .card h3{margin:0;padding:10px 12px;font-size:12.5px;font-weight:600;color:var(--muted);
    border-bottom:1px solid var(--line);letter-spacing:.04em}
  #left{overflow:auto}
  #stage{overflow:hidden}
  #stage canvas{display:block;width:100%;height:100%}
  #right{display:flex;flex-direction:column;gap:10px;overflow:auto;background:none;border:none}
  #right .card{flex:1;min-height:150px}
  #bottom{grid-column:1 / -1;display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:10px}

  .badge{position:absolute;top:8px;right:10px;font-size:10px;color:var(--muted);
    background:#0b1114cc;border:1px solid var(--line);border-radius:6px;padding:2px 6px}
  .block{padding:10px 12px;border-bottom:1px solid var(--line)}
  .row{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-bottom:6px}
  .val{color:var(--ink);font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--accent);height:18px}
  select,button{background:var(--panel2);color:var(--ink);border:1px solid var(--line);
    border-radius:6px;padding:5px 7px;font-size:12px;font-family:inherit}
  button{cursor:pointer}
  button:hover{border-color:var(--accent)}
  .presets{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px 12px}
  .presets button{text-align:left;font-size:11.5px;line-height:1.3}
  .presets button.on{border-color:var(--accent);color:var(--accent)}
  .kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 12px}
  .kpi div{background:var(--panel2);border-radius:8px;padding:8px}
  .kpi span{display:block;font-size:10.5px;color:var(--muted);margin-bottom:3px}
  .kpi b{font-size:16px;font-variant-numeric:tabular-nums}
  .kpi small{font-size:10px;color:var(--muted)}
  .warn{color:#d9a13b}
  .warnchip{display:inline-block;border:1px solid #5a4a2a;color:#d9a13b;border-radius:4px;padding:0 5px;margin:0 4px 3px 0;font-size:10px}
  .tiny{font-size:10.5px;color:var(--muted);padding:6px 12px 10px;line-height:1.5}
  .tag{display:inline-block;font-size:10px;border:1px solid var(--line);border-radius:4px;
    padding:0 4px;color:var(--muted);margin-left:4px}
  .tag.est{border-color:#3a4d57;color:#9db4bf}
  .tag.lit{border-color:#5a4a2a;color:#d9b06a}
  .tag.calc{border-color:#2a4a5a;color:#7fc4d8}
  #cropcard{display:grid;grid-template-rows:auto 1fr;overflow:hidden}
  #cropcard .body{padding:8px 12px;font-size:12px}
  #cropcard table{width:100%;border-collapse:collapse;font-size:12px}
  #cropcard th,#cropcard td{text-align:left;padding:5px 4px;border-bottom:1px solid var(--line)}
  #cropcard th{color:var(--muted);font-weight:500;font-size:10.5px}
  #cropcard tr.local td{color:#c9d6dc}
  .arrow{font-size:13px}
  .infeasible{filter:grayscale(1);opacity:.75}
  .stamp{position:absolute;inset:0;display:none;place-items:center;z-index:5;
    background:repeating-linear-gradient(45deg,#0e1417e6,#0e1417e6 10px,#12191de6 10px,#12191de6 20px);
    color:#c9d6dc;font-size:13px;text-align:center;padding:20px;line-height:1.7}
  .stamp.on{display:grid}
  .stamp em{color:var(--muted);font-style:normal;font-size:11.5px}
  #toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#0b1114;
    border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--muted);
    opacity:0;transition:opacity .25s;pointer-events:none;z-index:20}
  #toast.on{opacity:1}
  .flag{font-size:10px;border-radius:4px;padding:1px 5px}
  .flag.ok{background:#173028;color:#7ad3a7;border:1px solid #245141}
  .flag.infeasible{background:#2a2f33;color:#a7b3ba;border:1px solid #3b444a}
  .flag.gate{background:#2a2431;color:#c9a7e6;border:1px solid #4a3b57}
</style>
</head>
<body>
<div id="app">
  <div class="card" id="left">
    <h3>参数 · 器件与部署</h3>
    <div class="presets" id="presets"></div>
    <div class="block" id="sliders"></div>
    <div class="kpi" id="kpi"></div>
    <div id="warn" style="padding:0 12px 8px;font-size:10.5px;line-height:1.6"></div>
    <div class="tiny" id="meta"></div>
  </div>

  <div class="card" id="stage">
    <div class="badge">基于模型，非实测 · 单栋玻璃温室</div>
  </div>

  <div id="right">
    <div class="card"><h3>透射曲线 T(λ) · 红/远红窗已标出</h3><div id="chartT" style="height:calc(100% - 34px)"></div></div>
    <div class="card"><h3>Pareto：年发电量 – 作物代价</h3><div id="chartP" style="height:calc(100% - 34px)"></div></div>
  </div>

  <div id="bottom">
    <div class="card" id="cropcard">
      <h3>作物视角 · 冠层平均 vs 阵列正下方</h3>
      <div class="body" id="cropbody"></div>
    </div>
    <div class="card"><h3>与参照对比</h3><div id="chartB" style="height:calc(100% - 34px)"></div></div>
    <div class="card"><h3>同源校验</h3><div class="body tiny" id="verify" style="padding:10px 12px"></div></div>
  </div>
</div>
<div id="toast"></div>

<script src="./vendor/echarts.min.js"></script>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
